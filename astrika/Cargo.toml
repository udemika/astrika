[package]
name = "astrika"
version = "2.1.0"
edition = "2021"
description = "High-performance low-footprint IPTV MPEG-TS / HLS / UDP / RTP streaming server in Rust"
license = "MIT"

[[bin]]
name = "astrika"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "io-util", "macros", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.24", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
parking_lot = "0.12"
memchr = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
subtle = "2"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
url = "2"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
